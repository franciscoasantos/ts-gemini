services:
  gemini-bot:
    build: .
    container_name: gemini-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./keywords.txt:/app/keywords.txt:ro
      - ./avatar.png:/app/avatar.png:ro
    networks:
      - default
      - ts6

networks:
  ts6:
    external: true
    name: teamspeak_ts6
